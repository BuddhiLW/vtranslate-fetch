name: release

# ROLLING release: no ./VERSION, so the version is 0.{minor}.{git-count-revs}
# from version.edn + git history, and EVERY push that touches library sources
# mints an immutable artifact. (Adding a tracked ./VERSION would switch this
# lib to the pinned bump-and-tag mode with the same build.clj.)
#
# PRIVATE since the relicense: version.edn :publish is :gitea, so `deploy`
# builds an AOT no-source jar and pushes it to the private Gitea Maven
# registry. It used to be :clojars; 0.1.9 and earlier remain on Clojars under
# AGPL-3.0-or-later, because a published Maven coordinate is immutable.
#
# Path-filtered to library sources so CI / README / test-only commits don't mint
# an immutable pom.
#
# Secrets: MAVEN_USERNAME, MAVEN_TOKEN, MAVEN_URL — ORG-WIDE on vtranslate.
# NOT GITEA_-prefixed (Gitea reserves that prefix). An unset secret expands to
# the empty string, never an error, so these names must match the org secrets
# exactly. MAVEN_TOKEN is the name hive-build's :gitea target reads
# (:target/password-env); MAVEN_PASSWORD is accepted as a fallback because the
# sibling vtranslate repos were set up under that name.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it.
      - '.gitea/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_URL: ${{ secrets.MAVEN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOT DeLaGuardo/setup-clojure: that action calls the GitHub API
      # unconditionally and authenticates with GITHUB_TOKEN, which under Gitea
      # Actions is a *Gitea* token that github.com rejects. It logs ::error::
      # without failing its own step, so the job continues with no Clojure on
      # PATH and dies later with a bare exit 127, far from the cause.
      #
      # The official installer touches no API, so it behaves identically on
      # Gitea and GitHub. `clojure --version` is the assertion.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # deps-deploy resolves the repository id "hive-gitea" against BOTH the
      # project's :mvn/repos and ~/.m2/settings.xml, so the id, the URL and the
      # credentials have to agree in all three places or the deploy cannot find
      # its target. Every dependency of this lib resolves from Clojars, so this
      # exists for the PUSH, not for resolution.
      - name: Materialize private-registry credentials
        run: |
          set -euo pipefail
          TOKEN="${MAVEN_TOKEN:-${MAVEN_PASSWORD:-}}"
          if [ -z "$TOKEN" ] || [ -z "${MAVEN_URL:-}" ]; then
            echo "::error::MAVEN_URL and MAVEN_TOKEN (or MAVEN_PASSWORD) must be set org-wide on vtranslate."
            echo "This library is :publish :gitea, so with no credentials it cannot ship, and a silent skip"
            echo "would look identical to a successful release."
            exit 1
          fi
          echo "MAVEN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          CLJ_CONFIG="${CLJ_CONFIG:-${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/clojure}}"
          CLJ_CONFIG="${CLJ_CONFIG:-$HOME/.clojure}"
          mkdir -p "$CLJ_CONFIG" "$HOME/.m2"
          cat > "$CLJ_CONFIG/deps.edn" <<EOF
          {:mvn/repos {"hive-gitea" {:url "${MAVEN_URL}"}}}
          EOF
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>hive-gitea</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Gate BEFORE the deploy: a published pom is immutable, so a red suite
      # must not be able to mint a version and ship it.
      - name: Test
        run: clojure -M:test

      # `deploy` reads version.edn :publish (:gitea) and builds the AOT
      # no-source jar. Idempotent — a re-run at a version already in the
      # registry HEAD-checks and skips.
      - name: Deploy
        run: clojure -T:build deploy
