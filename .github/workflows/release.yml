name: release

# ROLLING release: no ./VERSION, so the version is 0.{minor}.{git-count-revs}
# from version.edn + git history, and EVERY push that touches library sources
# mints an immutable artifact. (Adding a tracked ./VERSION would switch this
# lib to the pinned bump-and-tag mode with the same build.clj, which is what
# the sibling vtranslate-engine does.)
#
# Lives under .github, not .gitea: GitHub is this library's canonical public
# home, the same as the engine. The Gitea remote stays a mirror, and having two
# CI systems publish the same coordinate would be a race that only deploy's
# idempotent HEAD-check saves.
#
# Path-filtered to library sources so CI / README / test-only commits don't
# mint an immutable pom.
#
# Secrets: CLOJARS_USERNAME and CLOJARS_PASSWORD (a Clojars DEPLOY TOKEN, not
# the account password). Set them on this repository or its org, or the run
# fails at the precondition step rather than publishing nothing quietly.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
      # The suite gates the deploy, so a test-only change MUST be able to
      # trigger a run: excluded here, a test fix can never be validated and a
      # test-only regression stays invisible until an unrelated src push trips
      # over it.
      - 'test/**'
      - 'tests.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it.
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Rolling versions are git-count-revs, so a shallow clone would
          # compute the wrong patch number.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The official installer touches no API, so it behaves identically on
      # GitHub and Gitea. `clojure --version` is the assertion.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # A missing credential must not read as a quiet success. Guarding the
      # deploy step with `if:` instead would make an unset secret produce a
      # green run that published nothing, which is indistinguishable from a
      # release that worked.
      - name: Require publish credentials
        run: |
          set -uo pipefail
          missing=
          [ -n "${CLOJARS_USERNAME:-}" ] || missing="${missing} CLOJARS_USERNAME"
          [ -n "${CLOJARS_PASSWORD:-}" ] || missing="${missing} CLOJARS_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::unset secret(s):${missing}. Nothing would be published."
            exit 1
          fi

      # Gate BEFORE the deploy. A published Maven coordinate is immutable, so a
      # red suite must not be able to mint a version and ship it.
      - name: Test
        run: clojure -M:test

      # `deploy` reads version.edn :publish (:clojars). Idempotent: a re-run at
      # a version already in the registry HEAD-checks and skips.
      - name: Deploy to Clojars
        run: clojure -T:build deploy
